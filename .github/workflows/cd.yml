# Deploy the exact commit that passed CI. Requires a pre-created staging Container App,
# an ACR-pull identity, a federated Azure identity, and a registered MLflow model version.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
      ACA_NAME: ${{ vars.ACA_NAME }}
      MODEL_REGISTRY_NAME: ${{ vars.MODEL_REGISTRY_NAME }}
      MODEL_VERSION: ${{ vars.MODEL_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: docker/setup-buildx-action@v3

      - name: Validate staging configuration
        shell: bash
        run: |
          for name in AZURE_RESOURCE_GROUP ACR_NAME ACR_LOGIN_SERVER ACA_NAME MODEL_REGISTRY_NAME MODEL_VERSION; do
            if [[ -z "${!name}" ]]; then
              echo "Missing GitHub staging variable: $name" >&2
              exit 1
            fi
          done
          echo "IMAGE_REPOSITORY=${IMAGE_REPOSITORY:-itcs355-serve}" >> "$GITHUB_ENV"

      - name: Build and push immutable image
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          docker buildx build --platform linux/amd64 \
            --file service/Dockerfile.serve \
            --tag "$ACR_LOGIN_SERVER/${IMAGE_REPOSITORY:-itcs355-serve}:$COMMIT_SHA" \
            --push .

      - name: Deploy to staging
        shell: bash
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$ACA_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/${IMAGE_REPOSITORY:-itcs355-serve}:$COMMIT_SHA" \
            --set-env-vars \
              "MODEL_REGISTRY_NAME=$MODEL_REGISTRY_NAME" \
              "MODEL_VERSION=$MODEL_VERSION" \
              "MLFLOW_TRACKING_URI=secretref:mlflow-tracking-uri"

      - name: Smoke test staging
        shell: bash
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show --name "$ACA_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          TARGET="https://$FQDN"
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$TARGET/ready" | jq -e \
              --arg version "$MODEL_VERSION" '.status == "ready" and .model_version == $version'; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "Staging did not become ready with model version $MODEL_VERSION" >&2
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error "$TARGET/predict" \
            -H 'content-type: application/json' \
            -d '{"temp_c":78.4,"vibration_mm_s":3.1,"pressure_kpa":315.2,"hours_since_service":4200,"load_pct":68,"ambient_humidity":55}' \
            | jq -e --arg version "$MODEL_VERSION" \
                '.probability >= 0 and .probability <= 1 and .model_version == $version and (.request_id | length > 0)'

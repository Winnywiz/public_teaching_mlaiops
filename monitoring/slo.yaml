# Lab 4 service level objectives. Targets are declared before drift/load evidence.

service: itcs355-predict

objectives:
  - name: availability
    target: 0.995
    window: 30d
    measurement: "successful / total POST /predict responses over a rolling 30 days, excluding 4xx"
    on_budget_exhausted: |
      Freeze model promotions, notify the on-call owner, and roll back to the last known-good
      revision if the 5xx increase is caused by the release. Resume only after the failing
      test or incident cause is fixed and the budget burn is reviewed.

  - name: latency
    target_p95_ms: 200
    window: 7d
    measurement: "p95 of POST /predict server-side request latency over a rolling 7 days"
    on_budget_exhausted: |
      Pause rollout, inspect p95 and p99 by revision, and restore the previous revision if
      the new model or image caused the regression. If load is the cause, right-size or
      scale the service before resuming deploys.

  - name: freshness
    target_max_model_age_days: 30
    window: continuous
    measurement: "days since the production model version was trained, checked daily"
    on_budget_exhausted: |
      Review data quality and drift evidence, then schedule a controlled retrain if the
      input shift is valid and persistent. Do not retrain on a broken schema or corrupted
      batch; repair and backfill the source first, while keeping the last good model.

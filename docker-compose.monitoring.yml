services:
  app:
    build:
      context: .
      dockerfile: service/Dockerfile.serve
    environment:
      MODEL_PATH: /app/reports/model.joblib
      MODEL_VERSION: ${MODEL_VERSION:-local}
    volumes:
      - ./reports:/app/reports:ro
    ports:
      - "127.0.0.1:8080:8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app
      - pushgateway

  pushgateway:
    image: prom/pushgateway:v1.11.0
    ports:
      - "127.0.0.1:9091:9091"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/itcs355-prediction.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

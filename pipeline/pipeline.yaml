# Provider-neutral DAG; cloudlayer.pipelines compiles the Azure branch to CLI v2 YAML.
name: itcs355-lab5-managed-pipeline
schedule: "0 2 * * 0"  # weekly Sunday, 02:00 UTC; see the retraining comparison in README
image: "${PIPELINE_IMAGE_URI}"
compute: "${AZURE_ML_COMPUTE}"
spot_compute: "${AZURE_ML_SPOT_COMPUTE}"

tags:
  course: itcs355
  student: "${PROJECT_ID}"
  lab: "5"

# Non-secret capability references are injected into every command step. Azure credentials
# are obtained from the managed identity; cloud.env and tokens are not copied into the image.
environment_variables:
  CLOUD_PROVIDER: azure
  PROJECT_ID: "${PROJECT_ID}"
  REGION: "${REGION}"
  BLOB_URI: "${BLOB_URI}"
  CONTAINER_REGISTRY: "${CONTAINER_REGISTRY}"
  MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI}"
  MODEL_REGISTRY_NAME: "${MODEL_REGISTRY_NAME}"
  IDENTITY_REF: "${IDENTITY_REF}"
  AZURE_SUBSCRIPTION_ID: "${AZURE_SUBSCRIPTION_ID}"
  AZURE_RESOURCE_GROUP: "${AZURE_RESOURCE_GROUP}"
  AZURE_ML_WORKSPACE: "${AZURE_ML_WORKSPACE}"
  AZURE_STORAGE_ACCOUNT: "${AZURE_STORAGE_ACCOUNT}"
  AZURE_STORAGE_CONTAINER: "${AZURE_STORAGE_CONTAINER}"
  AZURE_ACR_NAME: "${AZURE_ACR_NAME}"
  AZURE_ML_COMPUTE: "${AZURE_ML_COMPUTE}"
  AZURE_ML_SPOT_COMPUTE: "${AZURE_ML_SPOT_COMPUTE}"
  SERVING_IMAGE_URI: "${SERVING_IMAGE_URI}"
  AZURE_LAB5_CONTAINERAPP_ENVIRONMENT: "${AZURE_LAB5_CONTAINERAPP_ENVIRONMENT}"
  AZURE_LAB5_CONTAINERAPP_NAME: "${AZURE_LAB5_CONTAINERAPP_NAME}"
  AZURE_LAB5_CONTAINERAPP_IDENTITY: "${AZURE_LAB5_CONTAINERAPP_IDENTITY}"
  AZURE_LAB5_TRAINING_IDENTITY_CLIENT_ID: "${AZURE_LAB5_TRAINING_IDENTITY_CLIENT_ID}"
  AZURE_LAB5_JOB_IDENTITY_CLIENT_ID: "${AZURE_LAB5_JOB_IDENTITY_CLIENT_ID}"

steps:
  - name: ingest
    command: "python scripts/make_dataset.py --out '${{outputs.raw_data}}/sensors.csv'"
    identity:
      type: managed
    outputs:
      raw_data: uri_folder

  - name: validate
    command: >-
      python scripts/validate_pipeline_data.py
      --data '${{inputs.raw_data}}/sensors.csv'
      --receipt '${{outputs.validated}}'
    depends_on: [ingest]
    identity:
      type: managed
    inputs:
      raw_data: "${{parent.jobs.ingest.outputs.raw_data}}"
    outputs:
      validated: uri_file

  - name: train
    command: >-
      python -m src.train
      --data-path '${{inputs.raw_data}}/sensors.csv'
      --model-out '${{outputs.model}}/model.joblib'
      --checkpoint-dir '${{outputs.checkpoints}}'
      --metrics-out '${{outputs.metrics}}/metrics.json'
      --training-job-id '${{name}}'
      --image-digest '${PIPELINE_IMAGE_URI}'
      --instance-type '${AZURE_ML_SPOT_COMPUTE}'
      --spot
    depends_on: [validate]
    spot: true
    identity:
      type: managed
    environment_variables:
      AZURE_CLIENT_ID: "${AZURE_LAB5_TRAINING_IDENTITY_CLIENT_ID}"
    inputs:
      raw_data: "${{parent.jobs.ingest.outputs.raw_data}}"
      validation_receipt: "${{parent.jobs.validate.outputs.validated}}"
    outputs:
      model: uri_folder
      checkpoints: uri_folder
      metrics: uri_folder

  - name: evaluate
    command: >-
      python scripts/evaluation_gate.py
      --metrics '${{inputs.metrics}}/metrics.json'
      --decision-out '${{outputs.gate}}'
    depends_on: [train]
    identity:
      type: managed
    inputs:
      metrics: "${{parent.jobs.train.outputs.metrics}}"
    outputs:
      gate: uri_file

  - name: register
    command: >-
      python scripts/pipeline_register.py
      --metrics '${{inputs.metrics}}/metrics.json'
      --gate '${{inputs.gate}}'
      --out '${{outputs.registration}}'
    depends_on: [evaluate]
    identity:
      type: managed
    inputs:
      metrics: "${{parent.jobs.train.outputs.metrics}}"
      gate: "${{parent.jobs.evaluate.outputs.gate}}"
    outputs:
      registration: uri_file

  - name: deploy_staging
    command: >-
      python scripts/pipeline_deploy_staging.py
      --registration '${{inputs.registration}}'
    depends_on: [register]
    identity:
      type: managed
    inputs:
      registration: "${{parent.jobs.register.outputs.registration}}"
    environment_variables:
      AZURE_CLIENT_ID: "${AZURE_LAB5_JOB_IDENTITY_CLIENT_ID}"
